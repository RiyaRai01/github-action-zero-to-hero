name: Deploy to Server

on:
   workflow_call:
jobs:
    deploy:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout code
              uses: actions/checkout@v2
            
            - name: SSH to Prod Server & create app folder
              uses: appleboy/ssh-action@v1.0.3
              with:
                host: ${{ secrets.EC2_SERVER_HOST }}
                username: ${{ secrets.EC2_SERVER_USER }}
                key: ${{ secrets.EC2_SERVER_SSH_KEY }}
                script: |
                    echo "Starting Develoyment..."
                    mkdir -p devops  

            - name: Copy the docker-compse file 
              uses: appleboy/scp-action@v1
              with:
                host: ${{ secrets.EC2_SERVER_HOST }}
                username: ${{ secrets.EC2_SERVER_USER }}
                key: ${{ secrets.EC2_SERVER_SSH_KEY }}
                source: docker-compose.yml
                target: ~/devops    

            - name: SSH to Prod Server & run the app
              uses: appleboy/ssh-action@v1.0.3
              with:
                host: ${{ secrets.EC2_SERVER_HOST }}
                username: ${{ secrets.EC2_SERVER_USER }}
                key: ${{ secrets.EC2_SERVER_SSH_KEY }}
                script: |
                    echo "Running App"
                    sudo apt-get update && sudo apt-get install docker.io docker-compose-v2 -y 
                    sudo usermod -aG docker $USER && newgrp docker
                    export DOCKERHUB_USER=${{ vars.DOCKERHUB_USER }}
                    export DOCKER_TAG=${{ github.event.workflow_run.head_sha}}
                    echo ${{secrets.DOCKERHUB_TOKEN}} | docker login docker.io -u${{vars.DOCKERHUB_USER}} --password-stdin
                    cd ~/devops && docker compose down && docker compose up -d --build --force-recreate --pull always  

                    