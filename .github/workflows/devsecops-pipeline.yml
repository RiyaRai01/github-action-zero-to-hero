name: Devsecops End to End Pipeline

on:
    workflow_dispatch:

jobs:
    # CI
    code-quality:
        uses: ./.github/workflows/code-qualitycheck.yml
    secret-scanner:
        uses: ./.github/workflows/secretes-scan.yml
    dependency-scan:
        uses: ./.github/workflows/dependency-scan.yml
    docker-scan:
        uses: ./.github/workflows/docker-lint.yml        
    
    build:
        # CD - Docker Build and Push
        needs: [code-quality, secret-scanner, dependency-scan, docker-scan]
        uses: ./.github/workflows/docker-build-push.yml
        secrets: inherit
        
